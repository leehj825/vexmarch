# Builds an installable Android *debug* APK of Vexmarch (a Capacitor wrapper around the web game).
# It runs on every push to ANY branch (and on tags) that changes the game, so each branch gets its own APK; the manual "Run workflow"
# button (Actions -> "Android debug APK") appears once this file is on the default branch, and lets you pick any branch.
# When a run finishes, open it and download the "vexmarch-debug-apk-<branch>" artifact (a zip holding the .apk), then install it on a phone.
# The debug build shows Google's TEST ad banner. "Run workflow" has an option, ads = real, that builds with Vexmarch's real AdMob ids (tools/ads_ids.js) for a test on your own phone: do not click those ads.
name: Android debug APK
on:
  workflow_dispatch:
    inputs:
      ads:
        description: 'Banner ads: test (Google sample ads, safe) or real (Vexmarch AdMob ids)'
        type: choice
        options: [test, real]
        default: test
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['js/**', 'css/**', 'index.html', 'tools/make_www.js', 'tools/android_patch.js', 'package.json', 'package-lock.json', 'capacitor.config.json', 'resources/**', 'icons/**', '.github/workflows/android-debug.yml']
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses (the runner already has the SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Test the game logic
        run: npm ci && npm test
      - name: Generate the Android project and copy the game into it
        env:
          VX_ADS: ${{ inputs.ads == 'real' && 'real' || '' }}
        run: |
          npm run www
          [ -d android ] || npx cap add android
          node tools/android_patch.js
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Name the APK after the branch and commit
        id: name
        run: |
          BRANCH="${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk "vexmarch-debug-${BRANCH}-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v6
        with:
          name: vexmarch-debug-apk-${{ steps.name.outputs.branch }}
          path: vexmarch-debug-*.apk
          if-no-files-found: error
