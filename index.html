<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07060a">
<title>Vexmarch</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="titlemode">
<canvas id="map"></canvas>
<canvas id="city3d"></canvas>
<div id="hud">
  <div id="top">
    <div id="res">
      <span id="who"><i id="fdot" class="dot"></i><b id="fname"></b></span>
      <span id="gold"></span><span id="food"></span><span id="date"></span>
    </div>
    <div id="speed"><button id="offBtn" class="wide">Officers</button><button id="alertBtn" class="wide">Alerts</button><button id="setBtn" title="Settings">⚙</button><button data-s="0" title="Pause (space)">II</button><button data-s="1">1x</button><button data-s="2">2x</button><button data-s="4">4x</button><button id="menuBtn" title="Menu">☰</button></div>
  </div>
  <button id="backBtn">← Back to map</button>
  <div id="hint3d">Drag to look around · scroll or pinch to zoom</div>
  <div id="panel"></div>
  <div id="sheet"></div>
  <div id="lesson"></div>
  <div id="toast"></div>
  <div id="over"><div><h2 id="overT"></h2><p id="overP"></p><button id="overBtn">Main menu</button></div></div>
</div>
<div id="title" class="screen">
  <div class="card">
    <h1>Vexmarch</h1>
    <p class="tag">Command your realm in real time. Thirty nodes, many banners, one march.</p>
    <div class="lbl">Choose your faction</div>
    <div id="facList"></div>
    <div class="lbl">Rivals</div>
    <div id="countSel"><button data-n="4">4 factions</button><button data-n="5">5 factions</button><button data-n="6">6 factions</button></div>
    <div class="lbl">Rival AI</div>
    <div id="diffSel"><button data-d="easy">Easy</button><button data-d="normal">Normal</button><button data-d="hard">Hard</button></div>
    <div class="btns"><button id="startBtn" class="go">Start</button><button id="tutBtn">Tutorial</button><button id="rerollBtn">New map</button><button id="contBtn">Continue</button></div>
  </div>
</div>
<script src="js/data/config.js"></script>
<script src="js/sim/rng.js"></script>
<script src="js/sim/economy.js"></script>
<script src="js/sim/armies.js"></script>
<script src="js/sim/war.js"></script>
<script src="js/sim/officers.js"></script>
<script src="js/sim/ai.js"></script>
<script src="js/sim/world.js"></script>
<script src="js/sim/commands.js"></script>
<script src="js/sim/tick.js"></script>
<script src="vendor/three.min.js"></script>
<script src="js/view3d/layout.js"></script>
<script src="js/view3d/crowd_clips.js"></script>
<script src="js/view3d/crowd.js"></script>
<script src="js/view3d/city3d.js"></script>
<script src="js/ui/prefs.js"></script>
<script src="js/ui/audio.js"></script>
<script src="js/lang_ko.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui/map.js"></script>
<script src="js/ui/panels.js"></script>
<script src="js/ui/alerts.js"></script>
<script src="js/ui/sheets.js"></script>
<script src="js/ui/tutorial.js"></script>
<script src="js/ui/title.js"></script>
<script src="js/main.js"></script>
<script src="js/ads_env.js"></script>
<script src="js/ads.js"></script>
</body>
</html>
