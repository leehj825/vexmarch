<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07060a">
<title>Vexmarch</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="titlemode">
<canvas id="map3d"></canvas>
<canvas id="map"></canvas>
<canvas id="city3d"></canvas>
<div id="hud">
  <div id="top">
    <div id="res">
      <span id="who"><i id="fdot" class="dot"></i><b id="fname"></b></span>
      <span id="gold" data-tip="Your treasury, and how much you earn or lose each day."></span><span id="food" data-tip="Your food stock, and the daily balance. If it runs out, your people and armies starve."></span><span id="date" data-tip="One year has 360 days. Use the speed buttons to run time faster."></span>
    </div>
    <div id="speed"><button id="offBtn" class="wide" data-tip="Your officers: governors and army leaders, with their skills and loyalty.">Officers</button><button id="dipBtn" class="wide" data-tip="Alliances, gifts and terms with the other houses.">Diplomacy</button><button id="alertBtn" class="wide" data-tip="News of battles, losses and requests, and what pauses the game.">Alerts</button><button id="setBtn" data-tip="Settings">⚙</button><button data-s="0" data-tip="Pause (space)">II</button><button data-s="1">1x</button><button data-s="2">2x</button><button data-s="4">4x</button><button id="menuBtn" data-tip="Menu">☰</button></div>
  </div>
  <div id="mapctl"><button data-mc="north" data-tip="North up">⌖</button><button data-mc="left" data-tip="Turn left">⟲</button><button data-mc="right" data-tip="Turn right">⟳</button><button data-mc="up" data-tip="Tilt up">⇧</button><button data-mc="down" data-tip="Tilt down">⇩</button></div>
  <div id="hint3d">Drag to look around · two fingers to pan and zoom</div>
  <div id="panel"></div>
  <div id="sheet"></div>
  <div id="lesson"></div>
  <div id="toast"></div>
  <div id="pauseMenu"><div><h2>Paused</h2><button data-pm="resume" class="btn">Resume</button><button data-pm="chronicle" class="btn" id="pmChron">Chronicle</button><button data-pm="settings" class="btn">Settings</button><button data-pm="exit" class="btn">Save and go to the main menu</button></div></div>
  <div id="story"><div class="card"><h2 id="storyT"></h2><div id="storyB"></div><div class="btns"><button id="storyBtn" class="go">Continue</button></div></div></div>
  <div id="over"><div><h2 id="overT"></h2><p id="overP"></p><button id="overBtn">Main menu</button></div></div>
</div>
<div id="campaign" class="screen"><div class="card"><h1>The Sundering</h1><p class="tag" id="campTag"></p><div class="lbl">Choose your house</div><div id="campList"></div><div id="campInfo"></div><div class="btns"><button id="campGo" class="go">Begin</button><button id="campBack">Back</button></div></div></div>
<div id="title" class="screen">
  <div class="card">
    <h1>Vexmarch</h1>
    <p class="tag">Command your realm in real time. Thirty nodes, many banners, one march.</p>
    <div class="lbl">Choose your faction</div>
    <div id="facList"></div>
    <div class="lbl">Rivals</div>
    <div id="countSel"><button data-n="4">4 factions</button><button data-n="5">5 factions</button><button data-n="6">6 factions</button></div>
    <div class="lbl">Rival AI</div>
    <div id="diffSel"><button data-d="easy">Easy</button><button data-d="normal">Normal</button><button data-d="hard">Hard</button></div>
    <div class="btns"><button id="campBtn" class="go">Campaign</button><button id="startBtn">Skirmish</button><button id="tutBtn">Tutorial</button><button id="rerollBtn">New map</button><button id="contBtn">Continue</button></div>
  </div>
</div>
<script src="js/data/config.js"></script>
<script src="js/data/story.js"></script>
<script src="js/sim/rng.js"></script>
<script src="js/sim/economy.js"></script>
<script src="js/sim/armies.js"></script>
<script src="js/sim/war.js"></script>
<script src="js/sim/officers.js"></script>
<script src="js/sim/diplo.js"></script>
<script src="js/sim/ai.js"></script>
<script src="js/sim/world.js"></script>
<script src="js/sim/commands.js"></script>
<script src="js/sim/tick.js"></script>
<script src="js/sim/story.js"></script>
<script src="vendor/three.min.js"></script>
<script src="js/view3d/layout.js"></script>
<script src="js/view3d/struct_models.js"></script>
<script src="js/view3d/crowd_clips.js"></script>
<script src="js/view3d/crowd.js"></script>
<script src="js/view3d/city3d.js"></script>
<script src="js/view3d/walk.js"></script>
<script src="js/ui/prefs.js"></script>
<script src="js/ui/audio.js"></script>
<script src="js/lang_ko.js"></script>
<script src="js/i18n.js"></script>
<script src="js/view3d/terrain.js"></script>
<script src="js/ui/map.js"></script>
<script src="js/ui/panels.js"></script>
<script src="js/ui/alerts.js"></script>
<script src="js/ui/sheets.js"></script>
<script src="js/ui/tutorial.js"></script>
<script src="js/ui/tips.js"></script>
<script src="js/ui/diplo.js"></script>
<script src="js/ui/story.js"></script>
<script src="js/ui/title.js"></script>
<script src="js/main.js"></script>
<script src="js/ads_env.js"></script>
<script src="js/ads.js"></script>
</body>
</html>
